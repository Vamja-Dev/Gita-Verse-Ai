<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitaVerse AI — Login & Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Google Identity Services for the Google Button -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <div class="left">
    <img class="logo-img" src="logo.png" alt="GitaVerse AI">
    <img class="art" src="krishna.png" alt="God Krishna">
  </div>

  <div class="right">
    <div class="card">
      <div class="form-slider" id="formSlider">
        
        <!-- LOGIN PANE -->
        <form class="form-pane" id="loginForm" novalidate>
          <h2>Login</h2>
          <p class="sub">Access your GitaVerse AI account</p>

          <div class="field">
            <span class="icon">👤</span>
            <input type="text" id="loginUser" name="username" placeholder="Username or Email" required>
          </div>

          <div class="field">
            <span class="icon">🔒</span>
            <input type="password" id="loginPwd" name="password" placeholder="Password" required>
            <button type="button" class="toggle" onclick="togglePassword('loginPwd', this)">👁️</button>
          </div>

          <p class="error-msg" id="loginError"></p>

          <div class="row">
            <label class="remember">
              <input type="checkbox" name="remember"> Remember Me
            </label>
            <a href="#" class="forgot">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-submit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Login
          </button>

          <div class="divider">OR</div>

          <button type="button" class="btn-google">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6 29.5 4 24 4c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.2-2 13.9-5.4l-6.4-5.4C29.4 34.9 26.8 36 24 36c-5.4 0-9.9-3.1-11.3-7.6l-6.6 5C9.8 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.6 4.8-4.8 6.2l6.4 5.4C40.8 36.4 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
            Continue with Google
          </button>

          <!-- UPDATED LINK HERE -->
          <p class="switch-mode">Don't have an account? <a id="showRegister">Register</a></p>
        </form>

        <!-- REGISTER PANE -->
        <form class="form-pane" id="registerForm" novalidate>
          <h2>Sign Up</h2>
          <p class="sub">Begin your divine journey</p>

          <div class="field">
            <span class="icon">👤</span>
            <input type="text" id="regName" name="name" placeholder="Full Name" required>
          </div>

          <div class="field">
            <span class="icon">✉️</span>
            <input type="email" id="regEmail" name="email" placeholder="Email Address" required>
          </div>

          <div class="field">
            <span class="icon">🔒</span>
            <input type="password" id="regPwd" name="password" placeholder="Password" required>
            <button type="button" class="toggle" onclick="togglePassword('regPwd', this)">👁️</button>
          </div>

          <p class="error-msg" id="regError"></p>

          <button type="submit" class="btn-submit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            Create Account
          </button>

          <div class="divider">OR</div>

          <button type="button" class="btn-google">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6 29.5 4 24 4c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.2-2 13.9-5.4l-6.4-5.4C29.4 34.9 26.8 36 24 36c-5.4 0-9.9-3.1-11.3-7.6l-6.6 5C9.8 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.6 4.8-4.8 6.2l6.4 5.4C40.8 36.4 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
            Sign up with Google
          </button>

          <!-- UPDATED LINK HERE -->
          <p class="switch-mode">Already have an account? <a id="showLogin">Login</a></p>
        </form>

      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
